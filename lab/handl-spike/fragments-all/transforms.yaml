  node_kind: "mul"
  rule:
    !Declarative
    target_kind: "mul"
    children:
      - !Create
        kind: "silu"
        children:
          - !Create
            kind: "chunk"
            children:
              - !Create
                kind: "linear"
                children:
                  - !KeepPath
                    - 0
                    - 0
                    - 0
                  - !Create
                    kind: "concat"
                    children:
                      - !KeepPath
                        - 0
                        - 0
                        - 1
                      - !KeepPath
                        - 1
                        - 1
      - !Create
        kind: "chunk"
        children:
          - !Create
            kind: "linear"
            children:
              - !KeepPath
                - 0
                - 0
                - 0
              - !Create
                kind: "concat"
                children:
                  - !KeepPath
                    - 0
                    - 0
                    - 1
                  - !KeepPath
                    - 1
                    - 1
  catopt:
    law:
      version: 2
      kind: "law"
      name: "swiglu_fuse"
      law: "Product universal property: <f,g> = (f x g) . Delta.  Two projections of the same input are ONE GEMM into V x V, then project.  (Fused SwiGLU gate/up \u2014 MergedColumnParallelLinear.)"
      lhs:
        op: "mul"
        args:
          - op: "silu"
            args:
              - op: "linear"
                args:
                  - mvar: "x"
                  - mvar: "A"
                attrs: {}
            attrs: {}
          - op: "linear"
            args:
              - mvar: "x"
              - mvar: "B"
            attrs: {}
        attrs: {}
      rhs:
        op: "mul"
        args:
          - op: "silu"
            args:
              - op: "chunk"
                args:
                  - op: "linear"
                    args:
                      - mvar: "x"
                      - op: "concat"
                        args:
                          - mvar: "A"
                          - mvar: "B"
                        attrs:
                          dim: 0
                    attrs: {}
                attrs:
                  chunks: 2
                  dim: -1
                  index: 0
            attrs: {}
          - op: "chunk"
            args:
              - op: "linear"
                args:
                  - mvar: "x"
                  - op: "concat"
                    args:
                      - mvar: "A"
                      - mvar: "B"
                    attrs:
                      dim: 0
                attrs: {}
            attrs:
              chunks: 2
              dim: -1
              index: 1
        attrs: {}
      cond:
        - "and"
        - - "shape-compat"
          - "A"
          - "B"
        - - "rank"
          - "A"
          - ">="
          - 2
        - - "rank"
          - "B"
          - ">="
          - 2
      dspec: null
      tags:
        - "fusion"
        - "subsumed"
      derivation: []
      cert: null
      error_bound: null
      bound_norm: "spectral"
      serializable: true
      missing_hooks: []
    metavars:
      x:
        - 0
        - 0
        - 0
      A:
        - 0
        - 0
        - 1
      B:
        - 1
        - 1
  when:
    !And
    - !KindAt
      index: 0
      kind: "silu"
    - !KindAt
      index: 1
      kind: "linear"
    - !ChildCount 2
  priority: 17
