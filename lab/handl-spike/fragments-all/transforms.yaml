  catopt:
    law:
      version: 2
      kind: "law"
      name: "select_mul"
      law: "mul commutes with select: sel(u) \u2299 sel(v) = sel(u \u2299 v) \u2014 the elementwise product of two slices is the slice of the product (naturality of the elementwise action over the select view).  Removes one dispatched op per site."
      lhs:
        op: "mul"
        args:
          - op: "select"
            args:
              - mvar: "u"
            attrs:
              dim: "D"
              index: "I"
          - op: "select"
            args:
              - mvar: "v"
            attrs:
              dim: "D"
              index: "I"
        attrs: {}
      rhs:
        op: "select"
        args:
          - op: "mul"
            args:
              - mvar: "u"
              - mvar: "v"
            attrs: {}
        attrs:
          dim: "D"
          index: "I"
      cond:
        - "and"
        - - "dim-eq-attr"
          - "u"
          - "D"
          - "v"
          - "D"
        - - "shaped"
          - - "bcast"
            - "u"
            - "v"
