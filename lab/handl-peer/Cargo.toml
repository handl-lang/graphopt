[package]
name = "mlopt-handl-peer"
version = "0.1.0"
edition = "2021"
description = "Spike: mlopt calls handl's language loader and rewrite engine (local-only path deps)"

[lib]
name = "mlopt_handl_peer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26" }
serde_json = "1"
handl-language = { path = "/home/luis/GitHub/handl-lang/host/crates/handl-language" }
handl-kit-data-prelude = { path = "/home/luis/GitHub/handl-lang/host/crates/handl-kit-data-prelude" }
handl-plugin-engine-transform-rewrite = { path = "/home/luis/GitHub/handl-lang/host/crates/plugin-engine-transform-rewrite" }
