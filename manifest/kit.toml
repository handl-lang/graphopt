# kit.toml — the machinery this research composes, declared as data.
#
# The paper's thesis is that the entire pipeline — lift, discover+admit,
# lower — is *composition of declared components*, not a monorepo. This
# manifest is that claim made checkable: every component the research
# depends on is a row with its repo, its float policy (`branch = "main"`,
# no rev pins — the org convention), the crates/packages consumed, and
# the role it plays in the story.
#
# Consumers of this file: the reader (the composition map == the paper's
# §2), `packages/mlopt-experiments/` (the Rust arm is *enforced* by Cargo — these rows
# mirror `packages/mlopt-experiments/Cargo.toml`'s dep edges), and any future kit tool
# that wants to materialize the stack from a manifest.

schema = "handl-lang/research-kit@1"

[meta]
name = "graphopt"
paper = "paper/paper.qmd"
claim = "certified optimization of ML models/tensor programs — machinery composed as data on handl infra"
founding_result = "conv_bn_fold"

# ---------------------------------------------------------------------------
# Components — the Rust arm (enforced by cargo via packages/mlopt-experiments/Cargo.toml)
# ---------------------------------------------------------------------------

[[component]]
name = "kernel"
repo = "handl-lang/kernel"
float = "main"
kind = "cargo-git"
crates = ["handl-language", "handl-value"]
role = "the arrow-calculus kernel — the Language data schema, the tagged Value layer (TaggedValue incl. Tensor). The calculus the research lowers *into*."

[[component]]
name = "lang"
repo = "handl-lang/kit-prelude-lang"
float = "main"
kind = "cargo-git"
crates = ["handl-kit-prelude-lang"]
role = "the canonical Language as data — YAML fragments → Language. A language is a data change, never an engine recompile (the same 'as data' thesis as this paper's)."

[[component]]
name = "platform"
repo = "handl-lang/host"
float = "main"
kind = "cargo-git"
crates = [
    "handl-platform",
    "handl-runtime",
    "handl-plugin-module",
    "handl-plugin-lib-handl",
]
role = "the runtime + module bridge + the ModuleLoader that resolves .handl.toml dependency names. The evaluation substrate the certified artifact runs on."

[[component]]
name = "engines"
repo = "handl-lang/engine-{exec,lex-pattern,parse-pratt,exec-tree-walk}"
float = "main"
kind = "cargo-git"
crates = [
    "hnl-engine-exec",
    "hnl-engine-lex-pattern",
    "hnl-engine-parse-pratt",
    "hnl-engine-exec-tree-walk",
]
role = "the smallest honest engine set — data lex / pratt parse / tree-walk eval (post-ADR-0128 these live one crate per repo as `hnl-engine-*`, renamed from `handl-plugin-engine-*`)."

[[component]]
name = "host-tensor"
repo = "handl-lang/host-tensor"
float = "main"
kind = "cargo-git"
crates = ["handl-host-tensor"]
role = "the 18-op `tensor.*` host surface — dense n-d f64 tensors over the {\"__tensor__\":…} wire form. The op vocabulary the lifted program spells and the folded program runs against."

[[component]]
name = "egraph"
repo = "handl-lang/egraph"
float = "main"
kind = "cargo-git"
crates = ["handl-egraph"]
role = "the equality-saturation substrate — the named Rust port of mlopt-core's `EGraph`/`Rewrite` spec (mlopt-kit's `src/egraph.rs` drives it over the discovery codec's JSON wire forms; `egraph-run` is the subprocess bin). A real mlopt-kit dep, mirrored from `packages/mlopt-kit/Cargo.toml`."

[[component]]
name = "discovery"
repo = "handl-lang/discovery"
float = "main"
kind = "cargo-git"
crates = ["handl-discovery"]
role = "the ported domain-free half of `mlopt_discovery` — the `term_to_data`/`term_from_data` codec the egraph leg speaks, and the `GauntletLegs` trait surface `tests/gauntlet_stub.rs` injects into `run_gauntlet`. A real mlopt-kit dep, mirrored from `packages/mlopt-kit/Cargo.toml`."

[[component]]
name = "mlopt-kit"
repo = "handl-lang/graphopt"
path = "packages/mlopt-kit"
float = "main"
kind = "cargo-git"
crates = ["mlopt-kit"]
role = "mlopt's composition seam — the intended direct dep (it assembles this same stack), an in-tree workspace member (packages/mlopt-kit). Its deps float on the post-ADR-0128 `hnl-engine-*` crates at current main (the rename that briefly blocked it as a *git* dep is repointed). The artifact under measurement (hnl/conv_bn.hnl — the minted fold, evaluated) resolves in-tree at packages/mlopt-kit/hnl/conv_bn.hnl and is exported over the crate API as `CONV_BN_HNL` / `hnl_module(\"conv_bn\")` (include_str! — part of the crate artifact)."

# ---------------------------------------------------------------------------
# Components — the Python arm (the discovery engine; env-level composition)
# ---------------------------------------------------------------------------

[[component]]
name = "mlopt"
repo = "handl-lang/graphopt"
path = "packages/"
float = "main"
kind = "python-git"
packages = [
    "mlopt-core",
    "mlopt-torch",
    "mlopt-discovery",
    "mlopt-orchestrator",
    "mlopt-onnx",
]
role = "the discovery + admission machinery — lift (TorchSource: torch IR → mlopt calculus), laws-as-data minting, the admission gauntlet, deliver. Composed at the Python env level (uv/pip git deps), not vendored here."

# ---------------------------------------------------------------------------
# Experiments — the runnable evidence
# ---------------------------------------------------------------------------

[[experiment]]
name = "conv-bn-fold"
kind = "cargo"
run = "cargo run --release --manifest-path packages/mlopt-experiments/Cargo.toml --bin conv-bn-fold -- --repeat 200"
produces = "value-equality of spelled vs folded program through the composed kit + per-call wall of each arm (the runtime pay)"
artifact = "mlopt-kit's hnl/conv_bn.hnl — resolved in-tree (packages/mlopt-kit/hnl/conv_bn.hnl; the sibling-checkout / pkg-cache-slot / fetch arms remain as fallbacks for a standalone graphopt checkout — never vendored); the same source is exported over the crate API as mlopt_kit::CONV_BN_HNL for consumers that take the dep"

[[experiment]]
name = "conv-fold-premise-pay"
kind = "python"
run = "cd $MLOPT_DIR && .venv/bin/python bench/drivers/probes/conv_fold_premise_pay_probe.py"
produces = "the gauntlet account for the minted composite: guard transport, truth (guarded eval + premise-anchored derivability), typed pay, novelty"
note = "runs inside a mlopt checkout (MLOPT_DIR); the probe is mlopt's own, invoked — not copied"

# ---------------------------------------------------------------------------
# Gaps — surfaced, documented, not worked around by vendoring
# ---------------------------------------------------------------------------

[[gap]]
what = ".handl.toml git deps resolve to a package-cache slot ($HANDL_PKG_DIR, else ~/.handl/pkg/<name>) that nothing yet populates"
where = "platform's ModuleLoader / ADR-0010 fetch hook (upstream follow-up)"
workaround = "a checkout or symlink at the slot is the stand-in (this machine: ~/.handl/pkg/{host-tensor,mlopt-kit} are); `make artifact` fetches the file from the declared git source when no local arm resolves"
closed = "platform 6ce0e125 — fetch-on-miss in resolve_dependencies clones the declared repo@selector into the slot (subdir names the package root); HANDL_PKG_FETCH=off disables"

[[gap]]
what = "mlopt's Python packages are not cargo deps; the discovery arm composes at the Python env level"
where = "manifest's python-git component"
workaround = "declared here for reproducibility; consumed as `git+https://github.com/handl-lang/graphopt` uv/pip deps inside a mlopt venv"
