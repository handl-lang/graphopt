[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt"
version = "0.1.0dev"
description = "A sound mathematical discovery and optimization engine — categorical semantics, verified transformations, learned search; applications and backends are replaceable adapters (meta distribution over the domain packages in packages/; no importable `mlopt` package)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-torch",
    "mlopt-carriers",
    "mlopt-orchestrator",
    "mlopt-cuda",
    "mlopt-discovery",
    "mlopt-onnx",
    "gamekit",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "ty>=0.0.84",
    "vulture>=2.16",
    "import-linter>=2.15",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

[dependency-groups]
bench = [
    "jinja2>=3.1.6",
    "kaleido>=1.4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "tyro>=1.0.16",
]
# OPT-IN, TEST-ONLY differential oracle (Phase 4).  `egglog` drives a
# second equality-saturation engine used *only* by
# tests/test_egglog_oracle.py to cross-check mlopt's search on a small
# op/law subset.  It is deliberately NOT in `dev`: the repo stays light
# (egglog is a compiled Rust extension), the oracle test self-skips via
# `pytest.importorskip("egglog")` when the group is absent, and nothing
# under packages/ imports it.  Run with:
#   uv sync --group oracle && .venv/bin/python -m pytest tests/test_egglog_oracle.py
# egglog ships wheels for CPython >= 3.12 only, so the entry carries a
# `python_version` marker: the workspace still declares `>=3.11`, but
# the oracle group only resolves on the 3.12+ interpreters that can run
# it (the dev venv is 3.13).
oracle = [
    "egglog>=14.0; python_version >= '3.12'",
]
# OPT-IN field-baseline group.  `opt_einsum` ships the *standard*
# contraction-ordering players (`greedy`, the exact `optimal` DP) used
# by bench/drivers/probes/contraction/contraction_einsum.py to falsify the learned policy against a
# third-party yardstick instead of our own hand-built baselines.  It is
# deliberately NOT in `dev`: nothing under packages/ imports it, the
# tool self-skips (a `SystemExit` with a `uv sync --group einsum` hint)
# when the group is absent, and the default env stays unchanged.  Pinned
# to a release published > 7 days before this change (3.4.0, 2024-09-26),
# bounded below 4 so the lockfile cannot drift to an untested major.
#   uv sync --group einsum && .venv/bin/python bench/drivers/probes/contraction/contraction_einsum.py
einsum = [
    "opt_einsum>=3.4.0,<4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "ty>=0.0.84",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

# The root project is a pure meta distribution — plan 0008 removed the
# ``mlopt`` façade package, so nothing under the repo root is shipped.
[tool.setuptools]
packages = []

# --- uv workspace: the domain packages ---------------------------
[tool.uv.workspace]
members = ["packages/*"]
# mlopt-kit and mlopt-experiments are Rust-only crates (the handl
# composition seam + the paper's evidence crate) — no pyproject.toml,
# so they are excluded from the uv workspace.  mlopt-handl-peer is the
# maturin/PyO3 handl spike — excluded for the same reason.
# (mlopt-native moved to handl-lang/eqsat — plan 0032 phase 4.)
exclude = [
    "packages/mlopt-kit",
    "packages/mlopt-experiments",
    "packages/mlopt-handl-peer",
]

[tool.uv.sources]
# Extracted packages (plan 0032 phase 4): the substrate lives in
# handl-lang/eqsat, the game layer in handl-lang/gamekit — consumed as
# pinned git+ssh deps on ``packages/`` subdirectories, the same recipe
# kernelopt uses.  Bump the pin deliberately (branch for now; move to
# a tag/rev once the upstream surface settles).
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", branch = "main" }
mlopt-orchestrator = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-orchestrator", branch = "main" }
gamekit = { git = "https://github.com/handl-lang/gamekit.git", subdirectory = "packages/gamekit", branch = "main" }
mlopt-torch = { workspace = true }
mlopt-carriers = { workspace = true }
mlopt-cuda = { workspace = true }
mlopt-discovery = { workspace = true }
mlopt-onnx = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
    "slow: minutes-scale test (saturation at large budgets, torch.compile/Inductor); iterate with -m \"not slow\", run the full suite before committing",
    "e2e: crosses an external engine boundary (torch.compile/Inductor, onnxruntime, CUDA-graph capture, deliver pipeline); module-level marker, tagged on boundary-purpose files only",
]

# --- dead-code + architecture linting (dev tooling) ----------------
# vulture: flag unreachable/unused code at high confidence.  The suite
# is pinned at 100% coverage, so a genuine dead branch is a real
# finding, not noise.  Run `.venv/bin/vulture` (uses these paths) or
# `.venv/bin/vulture packages tests --min-confidence 80`; a
# non-zero exit (3) means dead code.  If a public member is kept only
# for the compatibility aliases, add its name to `ignore_names` here
# rather than leaving a false positive.
[tool.vulture]
min_confidence = 80
paths = ["packages", "tests"]

# import-linter: the hexagonal-boundary ratchet, pruned to the
# intra-repo contracts (plan 0032 phase 4): "core is torch-free" and
# "orchestrator imports no backend" moved to handl-lang/eqsat, "the
# game kernel is substrate-free" to handl-lang/gamekit.  What stays:
# the domain stack's own layering — discovery sits above the backend
# family; onnx is a self-contained backend over the (external) core.
[tool.importlinter]
root_packages = [
    "mlopt_torch",
    "mlopt_carriers",
    "mlopt_cuda",
    "mlopt_discovery",
    "mlopt_onnx",
]
include_external_packages = true

# `mlopt_torch` and `mlopt_carriers` are one layer: the carrier
# package is a torch-backend extension (its law modules carry
# `TORCH_BINDINGS`, and the torch sink builds its executor table from
# the carrier lowerings), so the two are genuinely bidirectional and
# must not be split across layers.  `mlopt_cuda` sits above them (it
# depends on `mlopt_torch`).  `mlopt_onnx` is the second backend (ADR
# 0006): it implements the `Sink` port over `onnx`/`onnxruntime` and
# depends on (external) `mlopt_core` alone, so it sits at the bottom.
# `mlopt_discovery` reads everything and nothing may depend back on
# it, so it sits above the whole stack.
[[tool.importlinter.contracts]]
name = "dependency layers"
type = "layers"
layers = [
    "mlopt_discovery",
    "mlopt_cuda",
    "mlopt_torch : mlopt_carriers",
    "mlopt_onnx",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

# The docstring gate applies to shipped code only: tests and bench are
# example/measurement code, not a public API surface.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
# ty is Astral's type checker (it replaced the earlier pyright ratchet).
# `[tool.ty.src] include` scopes checking to the shipped packages
# (tests/ and bench/ are not type-checked).  The ratchet `exclude` list
# is now EMPTY: every file that carried a baseline error count has been
# annotated, so `ty check` is clean with no opt-outs.  Keep it that way
# — add annotations, not exclude entries.  New modules under
# packages/*/src/ are checked automatically.
[tool.ty.environment]
python-version = "3.13"
extra-paths = [
    "packages/mlopt-torch/src",
    "packages/mlopt-carriers/src",
    "packages/mlopt-cuda/src",
    "packages/mlopt-discovery/src",
    "packages/mlopt-onnx/src",
    # mlopt-core/-orchestrator (eqsat) and gamekit resolve through the
    # installed git deps — no src path needed.
]

[tool.ty.src]
include = ["packages"]
exclude = []

[tool.ty.terminal]
# Errors are fatal, warnings are not.
error-on-warning = false

[tool.coverage.run]
# mlopt_discovery is measured but NOT under the fail_under=100 floor
# yet — the move from tools/ staged its coverage climb (see
# project/retros/discovery-package.md and the ratchet below); the
# gate runs a second `coverage report` with the pinned discovery floor.
# mlopt_onnx joined the 100 wall after its own climb (see
# project/retros/onnx-package.md) — it reports in the main wall, not
# the discovery ratchet.
source = ["mlopt_torch", "mlopt_carriers", "mlopt_cuda", "mlopt_discovery", "mlopt_onnx"]
branch = true
omit = ["*/tests/*"]

# --- mutation testing (mutmut) -------------------------------------
# Detects weak tests: a mutant that survives means the suite asserts
# nothing about that line.  Run it through the wrapper, which builds the
# flat-layout sandbox mutmut needs (its keys are path-derived, but this
# monorepo's per-package ``src/`` layout imports under a different dotted
# name):
#   MUTMUT_ONLY=mlopt_discovery/antiunify.py MUTMUT_TESTS='tests/test_antiunify.py' \
#       scripts/mutmut.sh run
#   scripts/mutmut.sh results
# There is intentionally no ``[tool.mutmut]`` table here: the wrapper
# writes one into the sandbox, and a direct in-repo run would mis-key
# every mutant.  Surviving mutants are weak-assertion findings, not
# coverage gaps (the suite is pinned at 100%).

[tool.coverage.report]
fail_under = 100       # ratcheted upward each refactor phase; target 100
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]
