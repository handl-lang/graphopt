[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-meta"
version = "0.1.0dev"
description = "mlopt meta-dist: verified model optimization — the product member is packages/mlopt (domain packages in packages/)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlopt-core",
    "kit-torch",
    "kit-carriers",
    "mlopt-orchestrator",
    "kit-cuda",
    "kit-discovery",
    "discoverykit",
    "kit-onnx",
    "kit-host-tensor",
    "mlopt-dtypes",
    "gamekit",
    "benchkit",
    "mlopt",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "ty>=0.0.84",
    "vulture>=2.16",
    "import-linter>=2.15",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]
# Re-homed from packages/mlopt (P3 Step D-2): the product member's
# optional adapter extras live at the root so
# `uv sync --extra hf --extra kokoro` works from the repo root.
hf = ["transformers"]
# Kokoro TTS adapter: transformers + huggingface_hub + loguru + attrs
# at load() time; the kokoro source tree itself is NOT a pip dep —
# clone https://github.com/hexgrad/kokoro to $KOKORO_SRC (default
# /tmp/kokoro-src) or pass kokoro_src= to load().
kokoro = ["transformers", "huggingface_hub", "loguru", "attrs", "numpy"]

[dependency-groups]
bench = [
    "jinja2>=3.1.6",
    "kaleido>=1.4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "tyro>=1.0.16",
]
# OPT-IN, TEST-ONLY differential oracle (Phase 4).  `egglog` drives a
# second equality-saturation engine used *only* by
# tests/test_egglog_oracle.py to cross-check mlopt's search on a small
# op/law subset.  It is deliberately NOT in `dev`: the repo stays light
# (egglog is a compiled Rust extension), the oracle test self-skips via
# `pytest.importorskip("egglog")` when the group is absent, and nothing
# under packages/ imports it.  Run with:
#   uv sync --group oracle && .venv/bin/python -m pytest tests/test_egglog_oracle.py
# egglog ships wheels for CPython >= 3.12 only, so the entry carries a
# `python_version` marker: the workspace still declares `>=3.11`, but
# the oracle group only resolves on the 3.12+ interpreters that can run
# it (the dev venv is 3.13).
oracle = [
    "egglog>=14.0; python_version >= '3.12'",
]
# OPT-IN field-baseline group.  `opt_einsum` ships the *standard*
# contraction-ordering players (`greedy`, the exact `optimal` DP) used
# by bench/drivers/probes/contraction/contraction_einsum.py to falsify the learned policy against a
# third-party yardstick instead of our own hand-built baselines.  It is
# deliberately NOT in `dev`: nothing under packages/ imports it, the
# tool self-skips (a `SystemExit` with a `uv sync --group einsum` hint)
# when the group is absent, and the default env stays unchanged.  Pinned
# to a release published > 7 days before this change (3.4.0, 2024-09-26),
# bounded below 4 so the lockfile cannot drift to an untested major.
#   uv sync --group einsum && .venv/bin/python bench/drivers/probes/contraction/contraction_einsum.py
einsum = [
    "opt_einsum>=3.4.0,<4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "vulture>=2.16",
    "import-linter>=2.15",
    "ty>=0.0.84",
    "hypothesis>=6.168.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "typeguard>=4.6.0",
    "mutmut>=3.8.0",
    "semgrep>=1.178.0",
]

# The root project is a pure meta distribution — plan 0008 removed the
# ``mlopt`` façade package, so nothing under the repo root is shipped.
[tool.setuptools]
packages = []

# --- uv workspace: the domain packages ---------------------------
[tool.uv.workspace]
members = ["packages/*"]
# mlopt-kit and mlopt-experiments are Rust-only crates (the handl
# composition seam + the paper's evidence crate) — no pyproject.toml,
# so they are excluded from the uv workspace.  mlopt-handl-peer is the
# maturin/PyO3 handl spike — excluded for the same reason.
# (mlopt-native moved to handl-lang/eqsat — plan 0032 phase 4.)
exclude = [
    "packages/mlopt-kit",
    "packages/mlopt-experiments",
    "packages/mlopt-handl-peer",
]

[tool.uv.sources]
# Extracted packages (plan 0032 phase 4): the substrate lives in
# handl-lang/eqsat, the game layer in handl-lang/gamekit — consumed as
# pinned git deps on ``packages/`` subdirectories at the ``v0.1.0``
# tag (git-URL-at-tag distribution; see
# docs/reports/git_url_distribution.md).  Bump the tag on releases.
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.14" }
mlopt-orchestrator = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-orchestrator", tag = "v0.1.14" }
gamekit = { git = "https://github.com/handl-lang/gamekit.git", subdirectory = "packages/gamekit", tag = "v0.1.16" }
benchkit = { git = "https://github.com/handl-lang/gamekit.git", subdirectory = "packages/benchkit", tag = "v0.1.16" }
# discoverykit (plan 0034 phase 1): the domain-free mining core
# extracted from the discovery engine (mlopt-discovery, now
# handl-lang/kit-discovery in P3 Step D-1d) — pinned git dep below.
discoverykit = { git = "https://github.com/handl-lang/discoverykit.git", subdirectory = "packages/discoverykit", tag = "v0.1.26" }
# kit-torch (P3 Step D-1e): the PyTorch adapters/backend, split to
# handl-lang/kit-torch — pinned git dep at the v0.1.4 tag.
kit-torch = { git = "https://github.com/handl-lang/kit-torch.git", tag = "v0.1.8" }
# kit-carriers (P3 Step D-1b): the semantic carriers, split to
# handl-lang/kit-carriers — pinned git dep at the v0.1.5 tag.
kit-carriers = { git = "https://github.com/handl-lang/kit-carriers.git", tag = "v0.1.8" }
# kit-cuda (P3 Step D-1c): the CUDA-graph delivery runner, split to
# handl-lang/kit-cuda — pinned git dep at the v0.1.5 tag.
kit-cuda = { git = "https://github.com/handl-lang/kit-cuda.git", tag = "v0.1.9" }
kit-discovery = { git = "https://github.com/handl-lang/kit-discovery.git", tag = "v0.1.8" }
kit-onnx = { git = "https://github.com/handl-lang/kit-onnx.git", tag = "v0.1.6" }
# kit-host-tensor (P3 Step D-1f): the host-tensor backend, split to
# handl-lang/kit-host-tensor — pinned git dep at the v0.1.4 tag.
kit-host-tensor = { git = "https://github.com/handl-lang/kit-host-tensor.git", tag = "v0.1.6" }
mlopt-dtypes = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-dtypes", tag = "v0.1.14" }
# packages/mlopt (P3 Step D-2): the product member — workspace dep so
# `uv sync` installs it and its `mlopt` console script lands in
# .venv/bin.
mlopt = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_cuda: test allocates CUDA tensors; skipped at setup when CUDA is absent or OOMs on a probe allocation",
    "slow: minutes-scale test (saturation at large budgets, torch.compile/Inductor); iterate with -m \"not slow\", run the full suite before committing",
    "e2e: crosses an external engine boundary (torch.compile/Inductor, onnxruntime, CUDA-graph capture, deliver pipeline); module-level marker, tagged on boundary-purpose files only",
]

# --- dead-code + architecture linting (dev tooling) ----------------
# vulture: flag unreachable/unused code at high confidence.  A genuine
# dead branch is a real finding, not noise (the 100% coverage wall
# left with kit_torch in P3 Step D-1e — floors live in the kit repos).  Run `.venv/bin/vulture` (uses these paths) or
# `.venv/bin/vulture packages tests --min-confidence 80`; a
# non-zero exit (3) means dead code.  If a public member is kept only
# for the compatibility aliases, add its name to `ignore_names` here
# rather than leaving a false positive.
[tool.vulture]
min_confidence = 80
paths = ["packages", "tests"]
# Unused params on test-double signatures (the interface requires the
# name; the double ignores it).  They were previously masked because
# packages/mlopt-torch used the same names — that package split to
# handl-lang/kit-torch in P3 Step D-1e.
# packages/mlopt findings (P3 Step D-2): pytest fixture parameters that
# are intentionally unused (``game_env`` injects the fixture for side
# effects), and deliberately-dead local stores in the whisper adapter /
# emit tables kept for readability.  Tighten by fixing, not by adding.
ignore_names = [
    "cap",
    "dev",
    "max_iterations",
    "game_env",
    "query_length",
    "want_max",
    "want_all",
    "want_std",
]

# import-linter: the hexagonal-boundary ratchet, pruned to the
# intra-repo contracts (plan 0032 phase 4): "core is torch-free" and
# "orchestrator imports no backend" moved to handl-lang/eqsat, "the
# game kernel is substrate-free" to handl-lang/gamekit.  What stays:
# the domain stack's own layering — discovery sits above the backend
# family.  (kit-onnx — the ONNX backend, formerly mlopt-onnx — split to
# handl-lang/kit-onnx in P3 Step D-1; kit-carriers and kit-cuda
# followed in D-1b/D-1c — their layering contracts live there.)
[tool.importlinter]
root_packages = [
    "kit_torch",
    "mlopt_dtypes",
]
include_external_packages = true

# `kit_torch` and `kit_carriers` (the carriers, split to
# handl-lang/kit-carriers in P3 Step D-1b) are one layer: the carrier
# package is a torch-backend extension (its law modules carry
# `TORCH_BINDINGS`, and the torch sink builds its executor table from
# the carrier lowerings under a lazy import), so the two are
# genuinely bidirectional and must not be split across layers — the
# layering contract itself lives in kit-carriers now, and the
# torch→carriers edge here stays undeclared + lazy.  `kit_cuda`
# (the CUDA-graph runner, split to handl-lang/kit-cuda in P3 Step
# D-1c) sits above `kit_torch` — its layering contract lives there.
# `kit_discovery` (the discovery engine, split to
# handl-lang/kit-discovery in P3 Step D-1d) reads everything and
# nothing may depend back on it — it is an external git dep now, so
# it leaves the layers table; the upward edge stays banned in the
# forbidden contract below.
[[tool.importlinter.contracts]]
name = "dependency layers"
type = "layers"
layers = [
    # kit_cuda (the CUDA-graph runner, split to handl-lang/kit-cuda
    # in P3 Step D-1c) sat above kit_torch here while
    # mlopt_discovery still imported it — post-D-1d nothing in the
    # scanned root packages reaches it, so grimp cannot resolve the
    # layer and import-linter hard-fails.  The enforceable half of
    # the ordering ("kit_torch must not reach up into kit_cuda")
    # moved to the forbidden contract below; kit-cuda's own repo
    # pins the other direction.
    "kit_torch",
    # The dtype registry is a leaf every backend reads — it sits below
    # the whole stack and nothing may depend back on it.
    "mlopt_dtypes",
]

# The game layer lives in other repos now (plan 0032/0034):
# ``gamekit`` is the substrate-free kernel, ``benchkit`` the
# benchmark harness, ``discoverykit`` the domain-free mining core.
# None of the tensor-domain packages may reach *up* into them —
# ``kit_discovery`` (external, handl-lang/kit-discovery) is the one
# sanctioned consumer of the game layer — the in-repo tensor packages
# must not reach up into it either, so it joins ``forbidden_modules``.
[[tool.importlinter.contracts]]
name = "domain packages never reach the game layer"
type = "forbidden"
source_modules = [
    "kit_torch",
    "mlopt_dtypes",
]
forbidden_modules = [
    "gamekit",
    "benchkit",
    "discoverykit",
    "kit_discovery",
    # kit_cuda sits above kit_torch — the tensor packages must not
    # reach up into the CUDA-graph runner (P3 Step D-1c/D-1d).
    "kit_cuda",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

# The docstring gate applies to shipped code only: tests and bench are
# example/measurement code, not a public API surface.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
# ty is Astral's type checker (it replaced the earlier pyright ratchet).
# `[tool.ty.src] include` scopes checking to the shipped packages
# (tests/ and bench/ are not type-checked).  The ratchet `exclude` list
# is now EMPTY: every file that carried a baseline error count has been
# annotated, so `ty check` is clean with no opt-outs.  Keep it that way
# — add annotations, not exclude entries.  New modules under
# packages/*/src/ are checked automatically.
[tool.ty.environment]
python-version = "3.13"
extra-paths = [
    # mlopt-core/-orchestrator (eqsat), kit_torch (P3 Step D-1e),
    # gamekit and kit_host_tensor (P3 Step D-1f) resolve through the
    # installed git deps — no src path needed.  packages/mlopt (P3
    # Step D-2) is scanned from source under include=["packages"] and
    # resolves its own imports through the installed workspace member.
]

[tool.ty.src]
include = ["packages"]
exclude = []

[tool.ty.terminal]
# Errors are fatal, warnings are not.
error-on-warning = false

# No [tool.coverage.*] tables: every shipped Python package has split
# to its own repo and each carries its own measured floor there
# (kit-onnx D-1, kit-carriers D-1b, kit-cuda D-1c, kit-discovery
# D-1d, kit-host-tensor D-1f, kit-torch D-1e).  This repo keeps the
# cross-stack suite that exercises them through the git deps; the
# domain wall (=100 on kit_torch) left with the package.

# --- mutation testing (mutmut) -------------------------------------
# Detects weak tests: a mutant that survives means the suite asserts
# nothing about that line.  Run it through the wrapper, which builds the
# flat-layout sandbox mutmut needs (its keys are path-derived, but this
# monorepo's per-package ``src/`` layout imports under a different dotted
# name):
#   MUTMUT_ONLY=kit_torch/region_fuse.py MUTMUT_TESTS='tests/test_region_fuse.py' \
#       scripts/mutmut.sh run
#   scripts/mutmut.sh results
# There is intentionally no ``[tool.mutmut]`` table here: the wrapper
# writes one into the sandbox, and a direct in-repo run would mis-key
# every mutant.  Surviving mutants are weak-assertion findings, not
# coverage gaps.

