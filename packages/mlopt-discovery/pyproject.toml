[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-discovery"
version = "0.1.0dev"
description = "Law-discovery engine for mlopt: census, proposal, oracles, evidence store and intake (formerly tools/law_*.py)."
requires-python = ">=3.11"
dependencies = ["mlopt-core", "mlopt-torch", "mlopt-orchestrator", "gamekit", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
