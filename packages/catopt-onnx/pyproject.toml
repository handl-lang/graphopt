[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catopt-onnx"
version = "0.1.0dev"
description = "ONNX backend for catopt (ADR 0006): catopt IR <-> ONNX graph — OnnxSink exports, OnnxSource imports, both verified through onnxruntime."
requires-python = ">=3.11"
dependencies = [
    "catopt-core",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
