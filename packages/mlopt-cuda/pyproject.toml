[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-cuda"
version = "0.1.0dev"
description = "CUDA-graph delivery mechanism for mlopt — the CUDA-coupled runner package (plan 0007)"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
