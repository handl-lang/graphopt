[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-cuda"
version = "0.1.0dev"
description = "CUDA-graph delivery mechanism for mlopt — the CUDA-coupled runner package (plan 0007)"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    # Phase B: the runner consumes mlopt_torch.device (DevicePolicy,
    # device_graph_key) — the import-linter `dependency layers`
    # contract already places mlopt_cuda above mlopt_torch.
    "mlopt-torch",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
