[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-dtypes"
version = "0.1.0dev"
description = "The dtype registry — one canonical name -> {torch, numpy, ONNX, safetensors, host-tensor wire} table shared by every mlopt backend. Pure stdlib; backends resolve the foreign dtype objects locally."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
