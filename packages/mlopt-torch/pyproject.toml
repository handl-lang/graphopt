[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopt-torch"
version = "0.1.0dev"
description = "PyTorch adapters for mlopt: torch.export bridge, executors, model zoo, reports."
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-orchestrator",
    "torch>=2.0",
    # The contraction-policy player's game maintains its pairwise
    # feature tables as NumPy arrays (and export.py's safetensors path
    # already calls ``Tensor.numpy()`` at runtime) — declare what was
    # previously only pulled in transitively by the dev environment.
    "numpy>=1.24",
]
# `mlopt-carriers` is a deliberate *optional* runtime dependency: the
# torch sink builds its carrier executor table from the carrier
# lowerings (`mlopt_torch.adapters._executor_specs`) under a
# `try/except ModuleNotFoundError`, degrading to the trace + generic
# table without them.  It is not declared here because `mlopt-carriers`
# already depends on `mlopt-torch` (its law modules carry
# `TORCH_BINDINGS`), and a declared cycle is not installable.  The
# `dependency layers` import-linter contract groups the two as one
# mutually-dependent backend layer instead.

[tool.setuptools.packages.find]
where = ["src"]

# Bundled pretrained weights — the contraction-ordering player
# (``mlopt_torch.contraction_policy.load_contraction_policy`` loads
# the oe-all distilled ``artifacts/contraction_policy_distilled.pt``
# lazily at call time; ``contraction_policy_curriculum.pt`` is the
# earlier RL lineage artifact, kept bundled as an alternate).
[tool.setuptools.package-data]
mlopt_torch = ["artifacts/*.pt"]
