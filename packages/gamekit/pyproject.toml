[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamekit"
version = "0.1.0dev"
description = "The game layer for mlopt: the Board protocol, episode/train/eval drivers, the player registry machinery, the scoring spec, score calibration and the game weight tables (plan 0032 lane A)."
requires-python = ">=3.11"
# Deliberately zero declared dependencies: the game *kernel* is
# substrate-free by contract (stdlib-only — the import-linter "game
# kernel is substrate-free" contract in the root pyproject), and the
# player *folders* bind domain machinery lazily inside their ``make``
# factories — the domain brings its own substrate (mlopt-discovery,
# mlopt-torch) into the caller's environment.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
