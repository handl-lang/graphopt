  node_kind: "linear"
  rule:
    !Declarative
    target_kind: "add"
    children:
      - !Create
        kind: "linear"
        children:
          - !KeepPath
            - 0
            - 0
          - !Create
            kind: "matmul"
            children:
              - !KeepPath
                - 1
              - !KeepPath
                - 0
                - 1
          - !Create
            kind: "matmul"
            children:
              - !KeepPath
                - 1
              - !KeepPath
                - 0
                - 2
      - !KeepPath
        - 2
  mlopt:
    law:
      version: 2
      kind: "law"
      name: "assoc_linear_bias"
      law: "Affine-map composition: (B,b2)\u2218(A,b1) = (BA, B\u00b7b1 + b2).  Fused weight is B @ A (same transpose flip as assoc_linear); the fused bias is spelled linear(x, BA, B\u00b7b1) + b2 so both B-products fold at compile time \u2014 one GEMM plus one broadcast add at runtime."
      lhs:
        op: "linear"
        args:
          - op: "linear"
            args:
              - mvar: "x"
              - mvar: "A"
              - mvar: "b1"
            attrs: {}
          - mvar: "B"
          - mvar: "b2"
        attrs: {}
      rhs:
        op: "add"
        args:
          - op: "linear"
            args:
              - mvar: "x"
              - op: "matmul"
                args:
                  - mvar: "B"
                  - mvar: "A"
                attrs: {}
              - op: "matmul"
                args:
                  - mvar: "B"
                  - mvar: "b1"
                attrs: {}
            attrs: {}
          - mvar: "b2"
        attrs: {}
      cond:
        - "and"
        - - "rank"
          - "A"
          - "=="
          - 2
        - - "rank"
          - "B"
          - "=="
          - 2
        - - "dim-eq"
          - "B"
          - 1
          - "A"
          - 0
        - - "rank"
          - "b1"
          - "=="
          - 1
        - - "dim-eq"
          - "b1"
          - 0
          - "A"
          - 0
        - - "or"
          - - "scalar"
            - "b2"
          - - "and"
            - - "rank"
              - "b2"
              - "=="
              - 1
            - - "dim-eq"
              - "b2"
              - 0
              - "B"
              - 0
        - - "rank"
          - "x"
          - ">="
          - 1
        - - "dim-eq"
          - "x"
          - -1
          - "A"
          - 1
      dspec: null
      tags:
        - "categorical"
        - "expansive"
      derivation: []
      cert: null
      error_bound: null
      bound_norm: "spectral"
      serializable: true
      missing_hooks: []
    metavars:
      x:
        - 0
        - 0
      A:
        - 0
        - 1
      b1:
        - 0
        - 2
      B:
        - 1
      b2:
        - 2
  when:
    !And
    - !KindAt
      index: 0
      kind: "linear"
    - !ChildCount 3
  priority: 4
- id: "transform.mlopt.assoc_linear_bias_rev"
  pass: "mlopt"
  node_kind: "add"
  rule:
    !Declarative
    target_kind: "linear"
    children:
      - !Create
        kind: "linear"
        children:
          - !KeepPath
            - 0
            - 0
          - !KeepPath
            - 0
            - 1
            - 1
          - !KeepPath
            - 0
            - 2
            - 1
      - !KeepPath
        - 0
        - 1
        - 0
      - !KeepPath
        - 1
