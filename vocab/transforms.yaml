    target_kind: "add"
    children:
      - !Create
        kind: "split"
        children:
          - !KeepPath
            - 0
            - 0
      - !KeepPath
        - 0
        - 1
  mlopt:
    law:
      version: 2
      kind: "law"
      name: "split_scalar_add_r"
      law: "split commutes with pointwise add when the other operand is scalar: the partition reads the same elementwise grid; the scalar accompanies every block unchanged."
