            args:
              - mvar: "v"
            attrs:
              dim: "D"
              index: "I"
        attrs: {}
      rhs:
        op: "select"
        args:
          - op: "mul"
            args:
              - mvar: "u"
              - mvar: "v"
            attrs: {}
        attrs:
          dim: "D"
          index: "I"
      cond:
        - "and"
        - - "dim-eq-attr"
          - "u"
          - "D"
          - "v"
          - "D"
        - - "shaped"
          - - "bcast"
