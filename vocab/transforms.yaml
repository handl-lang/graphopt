                  - mvar: "A"
                attrs: {}
              - op: "matmul"
                args:
                  - mvar: "B"
                  - mvar: "b1"
                attrs: {}
            attrs: {}
          - mvar: "b2"
        attrs: {}
      rhs:
        op: "linear"
        args:
          - op: "linear"
            args:
              - mvar: "x"
              - mvar: "A"
              - mvar: "b1"
            attrs: {}
          - mvar: "B"
          - mvar: "b2"
        attrs: {}
      cond:
        - "and"
        - - "rank"
          - "A"
          - "=="
          - 2
        - - "rank"
          - "B"
          - "=="
          - 2
        - - "dim-eq"
          - "B"
          - 1
          - "A"
          - 0
        - - "rank"
          - "b1"
          - "=="
          - 1
        - - "dim-eq"
          - "b1"
          - 0
          - "A"
          - 0
        - - "or"
          - - "scalar"
            - "b2"
          - - "and"
            - - "rank"
              - "b2"
              - "=="
              - 1
            - - "dim-eq"
              - "b2"
              - 0
              - "B"
              - 0
        - - "rank"
          - "x"
          - ">="
          - 1
        - - "dim-eq"
          - "x"
          - -1
          - "A"
          - 1
      dspec: null
      tags:
        - "categorical"
        - "expansive"
      derivation:
        - "assoc_linear_bias"
      cert: null
      error_bound: null
      bound_norm: "spectral"
      serializable: true
      missing_hooks: []
    metavars:
      x:
        - 0
        - 0
      B:
        - 0
        - 1
        - 0
      A:
        - 0
        - 1
        - 1
      b1:
        - 0
        - 2
        - 1
      b2:
        - 1
  when:
    !And
    - !KindAt
      index: 0
      kind: "linear"
    - !ChildCount 2
  priority: 11
