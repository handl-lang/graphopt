# Root cargo workspace — created for `catopt-kit` (plan: the modular
# handl-lang composition seam). The Python monorepo has no other cargo
# workspace; the pre-existing Rust crates — and `experiments/`
# (`mlopt-experiments`, the paper's evidence crate — see
# `manifest/kit.toml`), which floats on the post-rename `hnl-engine-*`
# stack catopt-kit can't yet share a lockfile with — keep their own
# manifests and lockfiles and are listed in `exclude` so `cargo` inside
# them still resolves them standalone.

[workspace]
resolver = "3"
members = ["packages/catopt-kit"]

exclude = [
    # the PyO3 search engine — built with maturin, own Cargo.lock
    "packages/catopt-native",
    # the G0 boundary spike — standalone crate with absolute path deps
    "lab/handl-peer",
    # the paper's evidence crate (manifest/kit.toml) — deliberately
    # *not* a member: it keeps its own manifest + Cargo.lock so the
    # experiment arm stays a standalone composition (the same dep edges
    # catopt-kit declares, duplicated for the standalone-checkout story).
    "experiments",
]

# ---------------------------------------------------------------------------
# Local-override story (the handl-lang `[patch]` convention).
#
# `catopt-kit`'s handl deps are git deps floating on `main`
# (`branch = "main"`). Local development resolves them to sibling-style
# checkouts in exactly one of two ways:
#
# 1. **git insteadOf (this host's default).** Sourcing
#    `~/.cache/devin/handl_deps.env` maps every
#    `https://github.com/handl-lang/<repo>` URL onto
#    `file:///home/luis/GitHub/handl-lang/<repo>` at fetch time
#    (`url.insteadOf` + `CARGO_NET_GIT_FETCH_WITH_CLI=true`) — the same
#    redirect `[patch]` performs, one level down. Nothing to uncomment.
#
# 2. **`[patch]` tables.** On a machine without the env file, point each
#    git source at a local checkout by uncommenting and repointing tables
#    like the one below (the shape every handl-lang repo itself uses —
#    see e.g. `host-tensor/Cargo.toml`):
#
# [patch."https://github.com/handl-lang/kernel"]
# handl-language = { path = "/path/to/kernel/crates/handl-language" }
# handl-value = { path = "/path/to/kernel/crates/handl-value" }
#
# [patch."https://github.com/handl-lang/lang"]
# handl-kit-data-canonical = { path = "/path/to/lang/crates/handl-kit-data-canonical" }
#
# [patch."https://github.com/handl-lang/host"]
# handl-platform = { path = "/path/to/platform/crates/platform" }
# handl-runtime = { path = "/path/to/platform/crates/handl-runtime" }
# handl-plugin-module = { path = "/path/to/platform/crates/plugin-module" }
# handl-plugin-lib-handl = { path = "/path/to/platform/crates/plugin-lib-handl" }
#
# # The engines live one crate per repo post-ADR-0128 (the `hnl-engine-*`
# # crates, single-crate-at-root layout like the `lib-*` ports):
# [patch."https://github.com/handl-lang/engine-exec"]
# hnl-engine-exec = { path = "/path/to/engine-exec" }
# [patch."https://github.com/handl-lang/engine-lex-pattern"]
# hnl-engine-lex-pattern = { path = "/path/to/engine-lex-pattern" }
# [patch."https://github.com/handl-lang/engine-parse-pratt"]
# hnl-engine-parse-pratt = { path = "/path/to/engine-parse-pratt" }
# [patch."https://github.com/handl-lang/engine-exec-tree-walk"]
# hnl-engine-exec-tree-walk = { path = "/path/to/engine-exec-tree-walk" }
# # …plus whatever the transitive tree pulls (hnl-engine{,-lex,-parse,
# # -exec-bytecode,-lint,-transform{,-rewrite},-typecheck},
# # handl-plugin-lib-char-native, handl-kit-{data,arrow-lower},
# # plugin-load, plugin-ext-diag, handl-test-utils, host-tooling…).
# # Add entries on demand — cargo names the missing package in the
# # error.
#
# [patch."https://github.com/handl-lang/host-tensor"]
# handl-host-tensor = { path = "/path/to/host-tensor" }
#
# [patch."https://github.com/handl-lang/lib-ops"]
# handl-lib-ops = { path = "/path/to/lib-ops" }
# handl-lib-str-handl = { path = "/path/to/lib-str-handl" }
# handl-lib-dedent = { path = "/path/to/lib-dedent" }
# ---------------------------------------------------------------------------
