[package]
name = "mlopt-experiments"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handl-lang/research-mlopt"
description = "research-mlopt evidence generation — the paper's experiments, composed from declared git deps on the handl stack; nothing vendored"

# Deliberately *not* a member of the root workspace (`exclude` in the
# root Cargo.toml): own manifest, own Cargo.lock, floats on current
# main — the same dep edges catopt-kit declares, duplicated so the
# experiment arm stays a standalone composition.

# The kit is composed here, over the same component set catopt-kit
# assembles — see `src/lib.rs`. The direct `catopt-kit` cargo dep is
# documented in manifest/kit.toml as the intended arm; it is unblocked
# now that catopt-kit's deps float on the post-ADR-0128 `hnl-engine-*`
# crates at current main, but this crate keeps the composed form as
# evidence that the stack assembles from declared components alone.

[dependencies]
serde_json = "1"

# kernel — Language data + the tagged value layer (incl. `TaggedValue::Tensor`)
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }

# lang — the canonical Language as data (YAML fragments → `Language`)
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }

# platform — the runtime + module bridge
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }

# engines — the smallest honest set: data lexer, Pratt parser, tree-walk
# eval (the `hnl-engine-*` crates in their own repos, post-ADR-0128)
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-lex-pattern = { git = "https://github.com/handl-lang/engine-lex-pattern", branch = "main" }
hnl-engine-parse-pratt = { git = "https://github.com/handl-lang/engine-parse-pratt", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }

# host-tensor — the `tensor.*` host-function surface (18 ops)
handl-host-tensor = { git = "https://github.com/handl-lang/host-tensor", branch = "main" }
